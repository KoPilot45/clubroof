name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clubroof
          POSTGRES_PASSWORD: clubroof
          POSTGRES_DB: clubroof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clubroof"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://clubroof:clubroof@localhost:5432/clubroof
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migrationen sind aktuell
        run: |
          pnpm --filter @clubroof/db generate
          git diff --exit-code -- packages/db/drizzle
      - run: pnpm test
      - name: Datenbank zurücksetzen und Demodaten einspielen
        run: pnpm db:reset
