# Lokale Entwicklungsumgebung.
# Start: pnpm db:up (Datenbank und Test-Postfach)   ·   Stopp: pnpm db:down
# Test-Postfach (Mailpit): http://localhost:8025 – zeigt alle E-Mails, die die App lokal verschickt
# Ein S3-kompatibler Dateispeicher folgt mit dem Dokumenten-Upload. Das bisher vorgesehene
# MinIO-Image wird vom Hersteller nicht mehr öffentlich bereitgestellt.
name: clubroof

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clubroof
      POSTGRES_PASSWORD: clubroof
      POSTGRES_DB: clubroof
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clubroof']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    profiles: ['mail']
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
