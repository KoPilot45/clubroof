# Lokale Entwicklungsumgebung: PostgreSQL, S3-kompatibler Speicher (MinIO) und Test-Mailserver.
# Start: pnpm db:up   ·   Stopp: pnpm db:down
name: clubroof

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clubroof
      POSTGRES_PASSWORD: clubroof
      POSTGRES_DB: clubroof
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clubroof']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: clubroof
      MINIO_ROOT_PASSWORD: clubroof-dev-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
  minio-data:
