<title>Aufstellungsplaner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Saira+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: eine Handy-Spalte im Stil „Anstoß“ – Kopfband, Spiel-Plakat, Spielfeld als Blickfang, darunter Bank, Kader mit Trainingsbeteiligung, Einstellung.
   Dunkel mit Vereinsfarbe Grün; bewusst nur dunkel (Vorgabe Design Anstoß). */
:root {
  --bg: #0B120E;
  --fg: #F2F7F3;
  --fg2: #C5D6CB;
  --fg3: #9FB5A6;
  --fg4: #6F8277;
  --surface: rgba(255, 255, 255, .06);
  --line: rgba(255, 255, 255, .09);
  --line2: rgba(255, 255, 255, .14);
  --accent: #2EDB6B;
  --on-accent: #06210F;
  --p1: #1E7A44;
  --p2: #0F3D24;
  --warn: #FFB020;
  --bad: #FF8A8A;
  --sheet: #16211A;
  --pitch-a: #12391F;
  --pitch-b: #0F3219;
  --pitchH: clamp(250px, calc(100svh - 550px), 460px);
  --display: 'Saira Condensed', 'Arial Narrow', sans-serif;
  --body: 'Open Sans', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.4; padding-block: 0 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); -webkit-tap-highlight-color: transparent; }
body.dragging { cursor: grabbing; user-select: none; -webkit-user-select: none; }
.app { max-width: 430px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; padding-block: 12px 8px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Kopfband */
.top { display: flex; align-items: center; gap: 10px; padding-top: 12px; }
.back { width: 36px; height: 36px; border-radius: 50%; background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .14); display: grid; place-items: center; flex: none; color: var(--fg); cursor: pointer; }
.back svg { width: 16px; height: 16px; }

/* Spiel-Plakat (kompakt) */
.hero { border-radius: 20px; padding: 10px 14px; background: radial-gradient(120% 140% at 90% 0%, var(--p1) 0%, var(--p2) 60%, var(--bg) 130%); border: 1px solid rgba(255, 255, 255, .08); position: relative; overflow: hidden; display: flex; gap: 12px; align-items: center; }
.hero::before { content: ""; position: absolute; inset: 0; opacity: .5; background-image: radial-gradient(circle at 50% 50%, transparent 0 11px, rgba(255, 255, 255, .06) 11px 12px, transparent 12px); background-size: 28px 24px; pointer-events: none; mask-image: linear-gradient(120deg, transparent 20%, #000 90%); -webkit-mask-image: linear-gradient(120deg, transparent 20%, #000 90%); }
.hero > * { position: relative; }
.hl { flex: 1; min-width: 0; }
.eyebrow { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font: 700 10.5px/1 var(--display); letter-spacing: .18em; text-transform: uppercase; color: #fff; opacity: .92; }
.match { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font: 800 20px/1.05 var(--display); margin: 5px 0 2px; }
.match em { font-style: normal; color: var(--accent); }
.when { font-size: 11px; color: var(--fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.figs { display: flex; gap: 16px; flex: none; }
.fig b { display: block; font: 800 34px/.95 var(--display); }
.fig b i { font-style: normal; font-size: 17px; color: var(--fg2); font-weight: 700; }
.fig span { font-size: 10.5px; color: var(--fg2); }

/* Zwischenüberschrift */
.sec { display: flex; align-items: center; gap: 9px; margin: 0 0 10px; font: 700 20px/1 var(--display); text-transform: uppercase; letter-spacing: .04em; }
.sec::before { content: ""; width: 3px; height: 18px; border-radius: 3px; background: var(--accent); }
.sec small { margin-left: auto; font: 600 12px var(--body); text-transform: none; letter-spacing: 0; color: var(--fg3); }

/* Spielform + Formation */
.seg { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { white-space: nowrap; flex: 1; border: 0; background: transparent; padding: 8px 4px; border-radius: 10px; font-weight: 700; font-size: 14px; color: var(--fg2); cursor: pointer; transition: background .15s, color .15s; }
.seg button small { font-weight: 600; font-size: 10.5px; opacity: .75; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.chips { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; padding: 2px 28px 2px 0; scrollbar-width: none; scroll-snap-type: x proximity; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 36px), transparent); }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; scroll-snap-align: start; white-space: nowrap; border: 1px solid var(--line2); background: var(--surface); border-radius: 99px; padding: 8px 15px; font: 700 17px/1 var(--display); letter-spacing: .03em; cursor: pointer; color: var(--fg2); }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: rgba(46, 219, 107, .12); }

/* Spielfeld */
.pitch { position: relative; border-radius: 22px; height: var(--pitchH); overflow: hidden; border: 1px solid var(--line2); background: repeating-linear-gradient(180deg, var(--pitch-a) 0 12.5%, var(--pitch-b) 12.5% 25%); box-shadow: 0 18px 40px rgba(0, 0, 0, .45), inset 0 0 0 1px rgba(255, 255, 255, .04); }
.pitch .ln { position: absolute; border: 2px solid rgba(255, 255, 255, .2); pointer-events: none; }
.ln.out { inset: 10px; border-radius: 6px; }
.ln.mid { left: 10px; right: 10px; top: 50%; height: 0; border-width: 2px 0 0; }
.ln.circ { width: 70px; height: 70px; border-radius: 50%; left: calc(50% - 35px); top: calc(50% - 35px); }
.ln.boxT { left: 25%; right: 25%; top: 10px; height: 15%; border-top: 0; }
.ln.boxB { left: 25%; right: 25%; bottom: 10px; height: 15%; border-bottom: 0; }
.ln.sixT { left: 38%; right: 38%; top: 10px; height: 6%; border-top: 0; }
.ln.sixB { left: 38%; right: 38%; bottom: 10px; height: 6%; border-bottom: 0; }
.pitch .tag { position: absolute; left: 50%; transform: translateX(-50%); font: 700 10px/1 var(--display); letter-spacing: .2em; text-transform: uppercase; color: rgba(255, 255, 255, .38); pointer-events: none; }
.tag.t { top: 14px; } .tag.b { bottom: 13px; }
.rows { position: absolute; inset: 14px 6px 12px; display: flex; flex-direction: column; justify-content: space-around; }
.row { display: flex; justify-content: space-around; }
.slot { flex: 1; min-width: 0; max-width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; touch-action: none; user-select: none; -webkit-user-select: none; }
.disc { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font: 800 19px/1 var(--display); background: #fff; color: #0B120E; box-shadow: 0 5px 12px rgba(0, 0, 0, .45), 0 0 0 3px rgba(255, 255, 255, .15); transition: transform .15s ease-out, box-shadow .15s; }
.slot[data-drag] { cursor: grab; }
.slot[data-drag]:hover .disc { transform: scale(1.06); }
.slot.empty .disc { background: rgba(0, 0, 0, .22); color: rgba(255, 255, 255, .55); border: 2px dashed rgba(255, 255, 255, .4); box-shadow: none; font: 700 13px/1 var(--display); letter-spacing: .08em; }
.nm { font: 700 10.5px/1.1 var(--body); background: rgba(6, 14, 9, .78); border-radius: 6px; padding: 3px 7px; max-width: 78px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.slot.empty .nm { visibility: hidden; }
.pdot { position: absolute; top: -2px; right: calc(50% - 28px); width: 13px; height: 13px; border-radius: 50%; border: 2px solid #0e1a12; }
.over .disc, .over.benchslot { box-shadow: 0 0 0 4px var(--accent), 0 0 24px rgba(46, 219, 107, .55); transform: scale(1.12); }
.sel .disc { box-shadow: 0 0 0 4px var(--warn), 0 0 22px rgba(255, 176, 32, .5); }
.guide { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: var(--fg3); margin-top: 10px; align-items: center; }
.guide i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
.hint { background: rgba(255, 176, 32, .14); color: var(--warn); border-radius: 12px; padding: 9px 12px; font-size: 12px; font-weight: 600; display: none; margin-top: 10px; }
.hint.on { display: block; }

/* Bühne: Spielfeld, Bank und Kader bleiben beim Scrollen sichtbar */
.editor { display: flex; flex-direction: column; gap: 10px; }
.stage { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); padding: 8px 0 6px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 10px 14px -10px var(--bg); }
.lab { display: flex; align-items: baseline; gap: 8px; font: 700 13px/1 var(--display); text-transform: uppercase; letter-spacing: .14em; color: var(--fg2); margin: 0 2px 5px; }
.lab::before { content: ""; width: 3px; height: 11px; border-radius: 3px; background: var(--accent); align-self: center; }
.lab small { white-space: nowrap; font: 600 11px var(--body); letter-spacing: 0; text-transform: none; color: var(--fg3); }
.lab .sorts { margin-left: auto; }
.lab .sorts button { padding: 4px 9px; font-size: 11px; letter-spacing: 0; text-transform: none; }
.strip { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 2px 4px; touch-action: pan-x; border-radius: 16px; transition: box-shadow .15s; }
.strip::-webkit-scrollbar { display: none; }
.strip.over { box-shadow: 0 0 0 3px var(--accent); }
.bs { flex: none; width: 60px; height: 62px; border-radius: 14px; background: var(--surface); border: 1px dashed var(--line2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; position: relative; touch-action: pan-x; user-select: none; -webkit-user-select: none; }
.bs[data-drag] { border-style: solid; border-color: var(--line); cursor: grab; }
.bs .disc { width: 32px; height: 32px; font-size: 15px; box-shadow: none; }
.bs .nm { background: none; padding: 0; font-size: 10px; color: var(--fg2); max-width: 56px; }
.bs .plus { color: var(--fg4); font: 700 11px var(--display); letter-spacing: .1em; }
.bs.sel { border-color: var(--warn); box-shadow: 0 0 0 2px var(--warn); }
.bs.over { box-shadow: 0 0 0 3px var(--accent); transform: scale(1.05); }
.bs .pdot { top: 3px; right: 8px; border-color: #1b2a21; }
.rail { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 2px 4px; touch-action: pan-x; border-radius: 16px; transition: box-shadow .15s; }
.rail::-webkit-scrollbar { display: none; }
.rail.over { box-shadow: 0 0 0 3px var(--accent); }
.rc { flex: none; width: 88px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); padding: 8px 6px 7px; display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative; touch-action: pan-x; user-select: none; -webkit-user-select: none; }
.rc[data-drag] { cursor: grab; }
.rc[data-drag]:hover { background: rgba(255, 255, 255, .09); }
.rc .disc { width: 38px; height: 38px; font-size: 17px; box-shadow: none; }
.rc b { font-size: 11.5px; max-width: 80px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc .ab { position: absolute; top: 6px; left: 7px; font: 700 10px var(--display); letter-spacing: .06em; color: var(--fg3); }
.rc .bars { display: flex; align-items: flex-end; gap: 3px; height: 16px; }
.rc .bars i { width: 6px; border-radius: 2px; background: var(--fg4); min-height: 3px; }
.rc .bars.g i { background: var(--accent); } .rc .bars.a i { background: var(--warn); } .rc .bars.r i { background: #FF6B6B; }
.rc small { font-size: 10px; font-weight: 700; color: var(--fg2); }
.rc .st { font-size: 9.5px; padding: 1px 6px; margin: 0; }
.rc.sel { border-color: var(--warn); box-shadow: 0 0 0 2px var(--warn); background: rgba(255, 176, 32, .12); }
.rc.na { opacity: .5; }
.empty-rail { flex: 1; padding: 18px 8px; text-align: center; color: var(--fg3); font-size: 12px; }
.st { font-size: 10.5px; font-weight: 700; border-radius: 99px; padding: 2px 8px; }
.st.ok { color: var(--accent); background: rgba(46, 219, 107, .13); }
.st.un { color: var(--warn); background: rgba(255, 176, 32, .16); }
.st.out { color: var(--bad); background: rgba(255, 90, 90, .16); }
.guide { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--fg3); margin: 0 2px; align-items: center; }
h2.sec small { margin-left: auto; font: 600 12px var(--body); text-transform: none; letter-spacing: 0; color: var(--fg3); }
.guide i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
.hint { background: rgba(255, 176, 32, .14); color: var(--warn); border-radius: 12px; padding: 7px 12px; font-size: 12px; font-weight: 600; display: none; }
.hint.on { display: block; }

/* Kader im Detail */
.tools { display: flex; margin: 10px 0; }
.sorts { display: flex; gap: 4px; }
.sorts button { white-space: nowrap; border: 1px solid var(--line2); background: transparent; border-radius: 99px; padding: 5px 12px; font: 600 12px var(--body); color: var(--fg3); cursor: pointer; }
.sorts button[aria-pressed="true"] { background: rgba(46, 219, 107, .14); border-color: var(--accent); color: var(--accent); }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 6px 4px; }
.pr { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 14px; position: relative; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.pr + .pr::before { content: ""; position: absolute; left: 62px; right: 10px; top: 0; height: 1px; background: var(--line); }
.pr[data-drag] { cursor: grab; }
.pr[data-drag]:hover { background: rgba(255, 255, 255, .04); }
.grip { width: 22px; height: 34px; display: grid; place-items: center; color: var(--fg4); touch-action: none; flex: none; }
.grip svg { width: 14px; height: 14px; }
.pr .disc { width: 36px; height: 36px; font-size: 16px; flex: none; box-shadow: none; }
.who { min-width: 0; flex: 1; }
.who b { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who span { font-size: 11.5px; color: var(--fg3); display: flex; align-items: center; gap: 6px; min-width: 0; }
.who span em { font-style: normal; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.who .st { flex: none; }
.st.in { color: var(--fg2); background: rgba(255, 255, 255, .1); }
.att { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex: none; }
.att .bars { display: flex; align-items: flex-end; gap: 3px; height: 20px; }
.att .bars i { width: 6px; border-radius: 2px; background: var(--fg4); min-height: 3px; }
.att .bars.g i { background: var(--accent); } .att .bars.a i { background: var(--warn); } .att .bars.r i { background: #FF6B6B; }
.att small { font-size: 10.5px; font-weight: 700; color: var(--fg2); white-space: nowrap; }
.pr.sel { background: rgba(255, 176, 32, .12); box-shadow: inset 0 0 0 2px var(--warn); }
.pr.na { opacity: .5; }
.group { font: 700 11px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--fg3); padding: 12px 12px 4px; }

/* Einstellung */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px 16px; }
.setting { display: flex; gap: 14px; align-items: center; }
.setting p { margin: 0; font-size: 12px; color: var(--fg3); }
.setting b { display: block; font-size: 14px; margin-bottom: 2px; }
.sw { width: 52px; height: 30px; border-radius: 99px; background: rgba(255, 255, 255, .16); border: 0; position: relative; flex: none; cursor: pointer; transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
.sw[aria-checked="true"] { background: var(--accent); }
.sw[aria-checked="true"]::after { transform: translateX(22px); }
.ctx { font-size: 11px; color: var(--fg3); margin: 0 0 8px; letter-spacing: .02em; }

/* Untere Leiste */
.acts { display: flex; gap: 8px; }
.btn { flex: 1; border-radius: 13px; border: 0; padding: 11px 10px; font-weight: 700; font-size: 13.5px; cursor: pointer; white-space: nowrap; }
.btn.sec2 { background: rgba(255, 255, 255, .09); color: var(--fg); flex: .85; }
.btn.pri { background: var(--accent); color: var(--on-accent); }
.btn:active { transform: scale(.97); }
.vis { text-align: center; font-size: 11.5px; color: var(--fg3); margin: 0; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--sheet); border: 1px solid var(--line2); border-radius: 14px; padding: 11px 16px; font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 30; max-width: min(92vw, 400px); text-align: center; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* Ziehfigur */
.ghost { position: fixed; z-index: 50; pointer-events: none; transform: translate(-50%, -62%) scale(1.15); filter: drop-shadow(0 14px 18px rgba(0, 0, 0, .55)); display: flex; flex-direction: column; align-items: center; gap: 4px; }
.ghost .disc { box-shadow: 0 0 0 3px var(--accent); width: 54px; height: 54px; }
#pitch.r5 .disc { width: 34px; height: 34px; font-size: 15px; } #pitch.r5 .nm { font-size: 9px; padding: 1px 5px; }
#pitch.r6 .disc { width: 28px; height: 28px; font-size: 13px; } #pitch.r6 .nm { font-size: 8.5px; padding: 1px 4px; } #pitch.r6 .pdot { width: 10px; height: 10px; right: calc(50% - 22px); }
#pitch.r5 .pdot { right: calc(50% - 24px); }
.row { flex: 1; align-items: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (min-width: 560px) { .app { margin-top: 12px; } }
</style>

  <div class="editor">

      <div class="hl">
        <div class="eyebrow">Aufstellung · B-Jugend</div>

<script>
// ---- Daten (Beispielkader B-Jugend, erfunden) ----
const W = [3, 3, 2, 3]; // Trainings je Woche der letzten 4 Wochen
const AB = { Torwart: 'TW', 'Linker Verteidiger': 'LV', 'Rechter Verteidiger': 'RV', Innenverteidiger: 'IV', 'Zentrales Mittelfeld': 'ZM', 'Offensives Mittelfeld': 'OM', Linksaußen: 'LA', Rechtsaußen: 'RA', Stürmer: 'ST' };
const mk = (id, name, nr, pos, att, status = 'ok', why = '') => ({ id, name, last: name.split(' ').slice(-1)[0], nr, pos, ab: AB[pos], att, status, why });
const PL = [
  mk(1, 'Jonas Keller', 1, 'Torwart', [3, 3, 2, 3]),
  mk(12, 'Elias Roth', 12, 'Torwart', [2, 3, 1, 2]),
  mk(3, 'Janne Hauke', 3, 'Linker Verteidiger', [3, 2, 2, 3]),
  mk(2, 'Gerrit Hanniske', 2, 'Innenverteidiger', [3, 3, 2, 3]),
  mk(4, 'Juan Buchholz', 4, 'Innenverteidiger', [2, 3, 2, 2]),
  mk(5, 'Angelo Dreier', 5, 'Rechter Verteidiger', [3, 3, 2, 2]),
  mk(15, 'Ben Schulte', 15, 'Innenverteidiger', [1, 2, 1, 2]),
  mk(18, 'Luca Brandes', 18, 'Linker Verteidiger', [2, 1, 2, 1]),
  mk(6, 'William Schuermann', 6, 'Zentrales Mittelfeld', [3, 3, 2, 3]),
  mk(8, 'Cem Heinrich', 8, 'Zentrales Mittelfeld', [3, 2, 2, 2]),
  mk(16, 'Paul Neumann', 16, 'Zentrales Mittelfeld', [2, 2, 1, 2]),
  mk(19, 'Emil Sauer', 19, 'Zentrales Mittelfeld', [3, 3, 2, 3], 'un'),
  mk(7, 'Gabriel Belz', 7, 'Offensives Mittelfeld', [3, 3, 2, 3]),
  mk(10, 'Leon Vogt', 10, 'Offensives Mittelfeld', [2, 3, 2, 3]),
  mk(11, 'Finn Albers', 11, 'Linksaußen', [3, 2, 2, 2]),
  mk(14, 'Mats Peters', 14, 'Rechtsaußen', [2, 3, 1, 2]),
  mk(9, 'Noah Krämer', 9, 'Stürmer', [3, 3, 2, 3]),
  mk(17, 'Tim Fricke', 17, 'Stürmer', [2, 1, 1, 2]),
  mk(20, 'Anton Wulf', 20, 'Innenverteidiger', [3, 2, 2, 3], 'out', 'Urlaub'),
  mk(21, 'Henri Maas', 21, 'Stürmer', [3, 3, 2, 3], 'out', 'Verletzt'),
];
const byId = Object.fromEntries(PL.map((p) => [p.id, p]));

// Formationen: Reihen von hinten nach vorn (D Abwehr, DM defensives Mittelfeld, M Mittelfeld, OM offensives Mittelfeld, A Angriff)
const LAB = {
  TW: { 1: ['TW'] },
  D: { 5: ['LV', 'IV', 'IV', 'IV', 'RV'], 4: ['LV', 'IV', 'IV', 'RV'], 3: ['IV', 'IV', 'IV'], 2: ['IV', 'IV'], 1: ['IV'] },
  DM: { 1: ['DM'], 2: ['DM', 'DM'], 3: ['DM', 'DM', 'DM'] },
  M: { 5: ['LM', 'ZM', 'ZM', 'ZM', 'RM'], 4: ['LM', 'ZM', 'ZM', 'RM'], 3: ['LM', 'ZM', 'RM'], 2: ['ZM', 'ZM'], 1: ['ZM'] },
  OM: { 1: ['OM'], 2: ['OM', 'OM'], 3: ['LA', 'OM', 'RA'] },
  A: { 3: ['LA', 'ST', 'RA'], 2: ['ST', 'ST'], 1: ['ST'] },
};
const F = (name, spec) => ({ name, rows: [['TW', 1], ...spec.split(' ').map((t) => [t.replace(/\d/g, ''), +t.replace(/\D/g, '')])].map(([r, n]) => LAB[r][n]) });
const SIZES = {
  7: { label: '7er', sub: '6 + Torwart', forms: [
    F('2-3-1', 'D2 M3 A1'), F('3-2-1', 'D3 M2 A1'), F('2-2-2', 'D2 M2 A2'), F('1-3-2', 'D1 M3 A2'), F('3-1-2', 'D3 DM1 A2'),
    F('2-1-2-1', 'D2 DM1 OM2 A1'), F('1-2-3', 'D1 M2 A3'), F('2-3-1 Raute', 'D2 DM1 OM1 A2'),
  ] },
  9: { label: '9er', sub: '8 + Torwart', forms: [
    F('3-3-2', 'D3 M3 A2'), F('3-2-3', 'D3 M2 A3'), F('2-4-2', 'D2 M4 A2'), F('2-3-3', 'D2 M3 A3'), F('4-3-1', 'D4 M3 A1'),
    F('3-4-1', 'D3 M4 A1'), F('4-2-2', 'D4 M2 A2'), F('3-1-3-1', 'D3 DM1 M3 A1'), F('2-2-3-1', 'D2 M2 OM3 A1'),
  ] },
  11: { label: '11er', sub: '10 + Torwart', forms: [
    F('4-4-2', 'D4 M4 A2'), F('4-3-3', 'D4 M3 A3'), F('3-5-2', 'D3 M5 A2'), F('4-2-3-1', 'D4 DM2 OM3 A1'), F('4-1-4-1', 'D4 DM1 M4 A1'),
    F('5-3-2', 'D5 M3 A2'), F('5-4-1', 'D5 M4 A1'), F('3-4-3', 'D3 M4 A3'), F('4-5-1', 'D4 M5 A1'), F('4-3-2-1', 'D4 M3 OM2 A1'),
    F('4-4-2 Raute', 'D4 DM1 M2 OM1 A2'), F('3-4-1-2', 'D3 M4 OM1 A2'), F('3-4-2-1', 'D3 M4 OM2 A1'), F('3-1-4-2', 'D3 DM1 M4 A2'),
  ] },
};

// ---- Zustand ----
let size = 11, fi = 0, sort = 'att';
let S = [1, 3, 2, 4, 5, 11, 6, null, 14, 9, null]; // Startelf in Slot-Reihenfolge
let B = [12, 15, null];                              // Bank: Spieler + immer genau ein freier Platz am Ende
let sel = null;                                       // { src, pid }
let visible = false;

const rowsNow = () => SIZES[size].forms[fi].rows;
const flatN = () => rowsNow().reduce((n, r) => n + r.length, 0);
const placed = () => new Set([...S, ...B].filter(Boolean));
const pct = (p) => Math.round(p.att.reduce((x, y) => x + y, 0) / W.reduce((x, y) => x + y, 0) * 100);
const tone = (p) => { const v = pct(p); return v >= 75 ? 'g' : v >= 50 ? 'a' : 'r'; };
const toneCol = { g: 'var(--accent)', a: 'var(--warn)', r: '#FF6B6B' };
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const normBench = () => { B = B.filter(Boolean); B.push(null); }; // es gibt immer einen freien Platz

function setSizeForm(ns, nf) {
  const carry = S.filter(Boolean), carryB = B.filter(Boolean);
  size = ns; fi = nf;
  const slots = flatN();
  S = Array(slots).fill(null);
  carry.forEach((id, i) => { if (i < slots) S[i] = id; });
  B = carry.slice(slots).concat(carryB);
  normBench(); sel = null;
}

// ---- Verschieben (jeder Spieler höchstens einmal) ----
const get = (k) => { if (k === 'p' || k === 'pool') return null; const [t, i] = k.split(':'); return (t === 's' ? S : B)[+i]; };
const put = (k, v) => { if (k === 'p' || k === 'pool') return; const [t, i] = k.split(':'); (t === 's' ? S : B)[+i] = v; };
function move(src, dst, pid) {
  if (src === dst) return;
  const here = src === 'p' ? pid : get(src);
  if (!here) return;
  if (dst === 'pool') { put(src, null); normBench(); return; }
  const other = get(dst);
  put(dst, here);
  if (src !== 'p') put(src, other || null);
  normBench();
}

// ---- Darstellung ----
function render() {
  const keepScroll = { forms: $('forms').scrollLeft, pool: $('pool').scrollLeft, bench: $('bench').scrollLeft };
  $('sizes').innerHTML = Object.entries(SIZES).map(([k, v]) => `<button aria-pressed="${+k === size}" data-size="${k}" title="${v.sub}">${v.label}</button>`).join('');
  $('forms').innerHTML = SIZES[size].forms.map((f, i) => `<button class="chip" aria-pressed="${i === fi}" data-form="${i}">${f.name}</button>`).join('');
  $('pitch').className = 'pitch r' + rowsNow().length;
  const rows = rowsNow(), starts = []; let acc = 0; rows.forEach((r) => { starts.push(acc); acc += r.length; });
  $('rows').innerHTML = rows.map((row, ri) => ({ row, ri })).reverse().map(({ row, ri }) => `<div class="row">${row.map((lab, ci) => {
    const i = starts[ri] + ci, pid = S[i], p = pid ? byId[pid] : null;
    if (!p) return `<div class="slot empty" data-drop="s:${i}"><div class="disc">${lab}</div><span class="nm">–</span></div>`;
    return `<div class="slot${sel && sel.src === 's:' + i ? ' sel' : ''}" data-drop="s:${i}" data-drag="s:${i}" data-pid="${pid}"><div class="disc">${p.nr}</div><i class="pdot" style="background:${toneCol[tone(p)]}"></i><span class="nm">${esc(p.last)}</span></div>`;
  }).join('')}</div>`).join('');

  $('bench').innerHTML = B.map((pid, i) => {
    const p = pid ? byId[pid] : null;
    if (!p) return `<div class="bs" data-drop="b:${i}"><span class="plus">FREI</span></div>`;
    return `<div class="bs${sel && sel.src === 'b:' + i ? ' sel' : ''}" data-drop="b:${i}" data-drag="b:${i}" data-pid="${pid}"><div class="disc">${p.nr}</div><i class="pdot" style="background:${toneCol[tone(p)]}"></i><span class="nm">${esc(p.last)}</span></div>`;
  }).join('');

  const used = placed();
  const avail = PL.filter((p) => p.status !== 'out' && !used.has(p.id));
  const out = PL.filter((p) => p.status === 'out');
  avail.sort(sort === 'att' ? (a, b) => pct(b) - pct(a) || a.nr - b.nr : (a, b) => a.nr - b.nr);
  const card = (p, na) => {
    const isSel = sel && sel.src === 'p' && sel.pid === p.id;
    const st = p.status === 'un' ? '<span class="st un">Unsicher</span>' : p.status === 'out' ? `<span class="st out">${p.why}</span>` : '';
    return `<div class="rc${na ? ' na' : ''}${isSel ? ' sel' : ''}" ${na ? '' : `data-drag="p" data-pid="${p.id}" data-rail="1"`}>
      <span class="ab">${p.ab}</span><div class="disc">${p.nr}</div><b>${esc(p.last)}</b>
      <div class="bars ${tone(p)}">${p.att.map((a, i) => `<i style="height:${Math.max(3, Math.round(a / W[i] * 16))}px"></i>`).join('')}</div>
      <small>${pct(p)} %</small>${st}</div>`;
  };
  $('pool').innerHTML = (avail.length ? avail.map((p) => card(p, false)).join('') : '<div class="empty-rail">Alle verfügbaren Spieler sind eingeplant. Ziehe einen Spieler hierher, um ihn aus der Aufstellung zu nehmen.</div>') + out.map((p) => card(p, true)).join('');
  const sortBtns = [['att', 'Beteiligung'], ['nr', 'Nummer']].map(([k, l]) => `<button aria-pressed="${sort === k}" data-sort="${k}">${l}</button>`).join('');
  $('sorts').innerHTML = sortBtns; $('sorts2').innerHTML = sortBtns;
  const where = new Map(); S.forEach((id, i) => id && where.set(id, 'Startelf')); B.forEach((id) => id && where.set(id, 'Bank'));
  const all = PL.filter((p) => p.status !== 'out').slice().sort(sort === 'att' ? (a, b) => pct(b) - pct(a) || a.nr - b.nr : (a, b) => a.nr - b.nr);
  const prow = (p, na) => {
    const loc = where.get(p.id);
    const isSel = sel && sel.src === 'p' && sel.pid === p.id;
    const chip = p.status === 'out' ? `<span class="st out">${p.why}</span>` : loc ? `<span class="st in">${loc}</span>` : p.status === 'un' ? '<span class="st un">Unsicher</span>' : '<span class="st ok">Zugesagt</span>';
    const dim = na || !!loc;
    return `<div class="pr${dim ? ' na' : ''}${isSel ? ' sel' : ''}" ${dim ? '' : `data-drag="p" data-pid="${p.id}" data-handle="1"`}>
      <span class="grip" aria-hidden="true"><svg viewBox="0 0 14 14" fill="currentColor"><circle cx="4" cy="3" r="1.4"/><circle cx="10" cy="3" r="1.4"/><circle cx="4" cy="7" r="1.4"/><circle cx="10" cy="7" r="1.4"/><circle cx="4" cy="11" r="1.4"/><circle cx="10" cy="11" r="1.4"/></svg></span>
      <div class="disc">${p.nr}</div>
      <div class="who"><b>${esc(p.name)}</b><span><em>${p.pos}</em>${chip}</span></div>
      <div class="att"><div class="bars ${tone(p)}">${p.att.map((a, i) => `<i style="height:${Math.max(3, Math.round(a / W[i] * 20))}px"></i>`).join('')}</div><small>${p.att.reduce((x, y) => x + y, 0)}/${W.reduce((x, y) => x + y, 0)} · ${pct(p)} %</small></div>
    </div>`;
  };
  $('list').innerHTML = all.map((p) => prow(p, false)).join('') + '<div class="group">Nicht verfügbar</div>' + out.map((p) => prow(p, true)).join('');
  $('listInfo').textContent = `${all.length} verfügbar · ${out.length} nicht verfügbar`;
  $('poolInfo').textContent = `${avail.length} verfügbar`;

  const ns = S.filter(Boolean).length, nb = B.filter(Boolean).length;
  $('nStart').textContent = ns; $('nStartMax').textContent = S.length; $('nBench').textContent = nb;
  $('benchInfo').textContent = `${nb} Spieler · ein Platz bleibt frei`;
  const h = $('hint');
  if (sel) { h.textContent = `${byId[sel.pid].name} gewählt. Tippe auf eine Position oder einen Bankplatz.`; h.classList.add('on'); } else h.classList.remove('on');
  $('vis').setAttribute('aria-checked', visible);
  $('visText').textContent = visible ? 'An: Spieler und Eltern sehen die Aufstellung nach dem Veröffentlichen.' : 'Aus: Nur das Trainerteam sieht die Aufstellung.';
  $('visHint').textContent = visible ? 'Nach dem Veröffentlichen sichtbar für Trainerteam, Spieler und Eltern' : 'Nach dem Veröffentlichen sichtbar nur für das Trainerteam';
  $('forms').scrollLeft = keepScroll.forms; $('pool').scrollLeft = keepScroll.pool; $('bench').scrollLeft = keepScroll.bench;
}

// ---- Ziehen und Tippen (Zeiger-Ereignisse: Maus, Finger, Stift) ----
// Die Leisten scrollen seitlich; ein Ziehen nach oben/unten hebt den Spieler heraus und bringt ihn aufs Feld.
let drag = null, ghost = null, lastOver = null;
document.addEventListener('pointerdown', (e) => {
  const el = e.target.closest('[data-drag]');
  if (!el || e.button > 0) return;
  drag = { src: el.dataset.drag, pid: +el.dataset.pid, x: e.clientX, y: e.clientY, on: false, el, strip: !!el.closest('.strip, .rail'), touch: e.pointerType !== 'mouse', canDrag: !(e.pointerType !== 'mouse' && el.dataset.handle && !e.target.closest('.grip')) };
});
document.addEventListener('pointermove', (e) => {
  if (!drag || !drag.canDrag) return;
  if (!drag.on) {
    const dx = Math.abs(e.clientX - drag.x), dy = Math.abs(e.clientY - drag.y);
    if (drag.strip && drag.touch) {
      if (dx > 8 && dx > dy) { drag = null; return; } // seitliches Wischen = Leiste scrollen
      if (dy < 8) return;
    } else if (Math.hypot(dx, dy) < 6) return;
    drag.on = true; document.body.classList.add('dragging');
    const p = byId[drag.pid];
    ghost = document.createElement('div'); ghost.className = 'ghost';
    ghost.innerHTML = `<div class="disc">${p.nr}</div><span class="nm">${esc(p.last)}</span>`;
    document.body.appendChild(ghost);
    drag.el.style.opacity = '.35';
  }
  ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px';
  const t = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-drop]');
  if (t !== lastOver) { lastOver?.classList.remove('over'); t?.classList.add('over'); lastOver = t; }
  // am Rand der Leisten automatisch weiterblättern
  const strip = document.elementFromPoint(e.clientX, e.clientY)?.closest('.strip, .rail');
  if (strip) { const r = strip.getBoundingClientRect(); if (e.clientX > r.right - 36) strip.scrollLeft += 8; else if (e.clientX < r.left + 36) strip.scrollLeft -= 8; }
}, { passive: true });
function end(e, cancel) {
  if (!drag) return;
  const d = drag; drag = null;
  document.body.classList.remove('dragging');
  if (d.on) {
    const target = cancel ? null : document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-drop]');
    ghost?.remove(); ghost = null; lastOver?.classList.remove('over'); lastOver = null; d.el.style.opacity = '';
    if (target) { move(d.src, target.dataset.drop, d.pid); sel = null; }
    render();
  } else if (!cancel) tap(d);
}
document.addEventListener('selectstart', (e) => { if (drag) e.preventDefault(); });
document.addEventListener('pointerup', (e) => end(e, false));
document.addEventListener('pointercancel', (e) => end(e, true));

function tap(d) { // Antippen: erst Spieler wählen, dann Platz antippen
  if (sel && sel.src === d.src && sel.pid === d.pid) { sel = null; render(); return; }
  if (sel && d.src !== 'p') { move(sel.src, d.src, sel.pid); sel = null; render(); return; }
  sel = { src: d.src, pid: d.pid }; render();
}
document.addEventListener('click', (e) => {
  const empty = e.target.closest('.slot.empty, .bs:not([data-drag])');
  if (empty && sel) { move(sel.src, empty.dataset.drop, sel.pid); sel = null; render(); return; }
  const s = e.target.closest('[data-size]'); if (s) { setSizeForm(+s.dataset.size, 0); render(); return; }
  const f = e.target.closest('[data-form]'); if (f) { setSizeForm(size, +f.dataset.form); render(); $('forms').querySelector('[aria-pressed="true"]')?.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' }); return; }
  const o = e.target.closest('[data-sort]'); if (o) { sort = o.dataset.sort; render(); }
});
$('vis').addEventListener('click', () => { visible = !visible; render(); });
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2600); }
$('save').addEventListener('click', () => toast('Entwurf gespeichert. Nur das Trainerteam sieht ihn.'));
$('publish').addEventListener('click', () => {
  const n = S.filter(Boolean).length;
  toast(n < S.length ? `Noch ${S.length - n} Position${S.length - n > 1 ? 'en' : ''} frei. Veröffentlichen ist trotzdem möglich.` : (visible ? 'Veröffentlicht. Nominierte, Spieler und Eltern sehen die Aufstellung.' : 'Veröffentlicht. Die Nominierten werden benachrichtigt.'));
});
render();
</script>
