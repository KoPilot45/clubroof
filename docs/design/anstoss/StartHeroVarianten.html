/* Seite rechts */
.no{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#1E7A44;color:#fff;font:700 11px var(--body);font-style:normal;margin-left:6px;flex:none;box-shadow:0 0 0 2px var(--card)}

.app{--zc:var(--ok);--uc:var(--amb);--ac:var(--red);--oc:var(--line)}
.sg.d-bar .s.y,.sg.d-fill .s.y{color:var(--ok)}.sg.d-bar .s.m,.sg.d-fill .s.m{color:var(--amb)}.sg.d-bar .s.n,.sg.d-fill .s.n{color:var(--red)}

.hero .sg.d-prop .s.y{background:rgba(138,242,175,.26)}.hero .sg.d-prop .s.m{background:rgba(255,181,71,.28)}.hero .sg.d-prop .s.n{background:rgba(255,138,128,.28)}
