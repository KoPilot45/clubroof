<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Login · mit Vereinslogo</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&amp;family=Open+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"><style>
body{margin:0;font-family:'Open Sans',system-ui,sans-serif}
button{font-family:inherit}
.p{position:relative;width:390px;height:844px;box-sizing:border-box;background:#F6F8F6;color:#17231B;overflow:hidden;font-family:'Open Sans',system-ui,sans-serif}
.top{display:flex;align-items:center;gap:12px;padding:24px 20px 0 20px}
.back{flex:0 0 44px;width:44px;height:44px;border-radius:22px;border:0;background:#FFFFFF;box-shadow:0 4px 14px rgba(20,40,28,0.08);display:flex;align-items:center;justify-content:center;cursor:pointer}
.prog{flex:1 1 auto;min-width:0}
.prog .l{display:flex;justify-content:space-between;font-size:12px;color:#5B6B60;margin-bottom:6px}
.prog .bar{height:8px;border-radius:4px;background:#DDE5DF;overflow:hidden}
.h1{font-family:Oswald,sans-serif;font-weight:500;font-size:30px;line-height:1.1;margin:0}
.lead{font-size:15px;line-height:1.45;color:#44544A;margin:8px 0 0 0}
.bottom{position:absolute;left:0;right:0;bottom:0;padding:18px 20px 26px 20px;background:linear-gradient(to top,#F6F8F6 70%,rgba(246,248,246,0))}
.cta{width:100%;height:52px;border:0;border-radius:26px;color:#FFFFFF;font-size:16px;font-weight:700;cursor:pointer}
.link{display:block;text-align:center;font-size:14px;font-weight:600;color:#1F7A3D;margin-top:12px;min-height:24px}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600}
.sw i{display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:28px;box-sizing:border-box}
.sel i{box-shadow:0 0 0 3px #F6F8F6,0 0 0 6px #17231B}
.lab{font-size:13px;font-weight:700;margin-bottom:6px}
.inp{height:52px;box-sizing:border-box;border-radius:16px;border:1.5px solid #D5DDD7;background:#FFFFFF;padding:0 16px;display:flex;align-items:center;font-size:16px}
.hint{font-size:12px;color:#5B6B60;margin-top:6px;line-height:1.35}
.eb{font-size:12px;font-weight:700;letter-spacing:1.4px;color:#1F7A3D}
.card{display:flex;align-items:center;gap:14px;background:#FFFFFF;border:1.5px solid #E1E8E3;border-radius:20px;padding:14px 16px;box-shadow:0 4px 14px rgba(20,40,28,0.05)}
.card.on{border-color:#1F7A3D;background:#F1FAF3}
.card .ic{flex:0 0 44px;width:44px;height:44px;border-radius:14px;background:#E3F4E7;display:flex;align-items:center;justify-content:center}
.card .t{font-size:15px;font-weight:700}.card .d{font-size:12.5px;color:#5B6B60;line-height:1.35;margin-top:2px}
.card .rd{flex:0 0 24px;width:24px;height:24px;border-radius:12px;border:2px solid #C5D0C8;box-sizing:border-box;margin-left:auto}
.card.on .rd{background:#1F7A3D;border-color:#1F7A3D;box-shadow:inset 0 0 0 4px #F1FAF3}
.tg{flex:0 0 46px;width:46px;height:28px;border-radius:14px;background:#C5D0C8;position:relative;margin-left:auto}
.tg:after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff}
.tg.on{background:#1F7A3D}.tg.on:after{left:21px}
.info{display:flex;gap:10px;background:#FFF6DA;border-radius:16px;padding:12px 14px;font-size:12.5px;line-height:1.4;color:#5A4600}
.chip{display:inline-block;font-size:13px;font-weight:600;border-radius:999px;padding:8px 14px;background:#FFFFFF;border:1.5px solid #D5DDD7;margin:0 6px 8px 0}
.chip.on{background:#1F7A3D;border-color:#1F7A3D;color:#fff}
.stack{display:flex;flex-direction:column;gap:10px;padding:20px 24px 0 24px}
